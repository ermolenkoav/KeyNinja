name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build universal KeyNinja.app
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          ./scripts/bundle-macos.sh
          lipo -create -output target/KeyNinja.app/Contents/MacOS/keyninja \
            target/aarch64-apple-darwin/release/keyninja \
            target/x86_64-apple-darwin/release/keyninja
          codesign --force --sign - target/KeyNinja.app
          cd target && ditto -c -k --keepParent KeyNinja.app KeyNinja-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: target/KeyNinja-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: tar -czf keyninja-linux-x86_64.tar.gz -C target/release keyninja
      - uses: softprops/action-gh-release@v2
        with:
          files: keyninja-linux-x86_64.tar.gz
